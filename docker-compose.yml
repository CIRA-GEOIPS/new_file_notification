# Run this with 'docker-compose run --rm calipso-ingest-podaac'
# Or just 'docker-compose up'
services:
  get_file_notif:
    build: 
      context: .
      args:
        - GITHUB_TOKEN=${GITHUB_TOKEN}
        - GIT_UNAME=${GIT_UNAME}
        - INV_API_TOKEN=${ACCESS_TOKEN}
        - INV_API_VERSION=${INV_API_VERSION:-}

    image: get_file_notif
    #container_name: get_file_notif

    user: ${UID}:${GID}
    extra_hosts:
      # alioth probably or echo1 (k8s)
      - database:${DB_IP}
    volumes:
      - ./:/app
      - /mnt/ahi:/mnt/ahi:ro
      - /mnt/sat:/mnt/sat:ro
      - /mnt/grb:/mnt/grb:ro
      - /mnt/overcastnas1:/mnt/overcastnas1:ro
      - /mnt/MTG-I1:/mnt/MTG-I1:ro
      - /mnt/ahi-nas4:/mnt/ahi-nas4:ro

    working_dir: /app

    env_file:
      - .env

    network_mode: ${DOCKER_NETWORK}
    entrypoint: ${COMMAND}
