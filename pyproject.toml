# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# Choosing a build backend for your Python package
[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta" 

[project]
name = "new_file_notification" # REQUIRED
version = "0.1.0"  # REQUIRED, although can be dynamic
description = "Send and receive new file notifications"
readme = "README.md"

requires-python = ">=3.8"

dependencies = [
  "pika",
  "data_inv_api @ git+ssh://git@bear.cira.colostate.edu/geoips/data_inv_api.git",
  "geoips @ git+ssh://git@github.com/NRLMMD-GEOIPS/geoips.git"
]

authors = [
  {name = "Jim Fluke", email = "james.fluke@colostate.edu" }
]
